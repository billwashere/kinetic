<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Explanation</title>
    <script>
      // Same saved or OS colour scheme as the portal, before first paint.
      (function () {
        var mode = null;
        try {
          mode = localStorage.getItem('kinetic-theme');
        } catch (e) {}
        if (mode === 'dark' || (!mode && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      })();
    </script>
    <link rel="stylesheet" href="explorer.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="bar">
        <a class="brand" id="brand" href="./">
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></svg>
          <span id="site-name">Documentation</span>
        </a>
        <nav id="tabs" aria-label="Documentation sections" hidden></nav>
        <div class="tools">
          <label class="sr-only" for="locale">Language</label>
          <select id="locale"></select>
          <button id="theme" type="button" aria-label="Dark mode" aria-pressed="false">
            <svg class="moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
            <svg class="sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          </button>
        </div>
      </div>
    </header>
    <div class="page">
      <h1>Explanation</h1>
      <p class="lede">The concepts and features behind the guides, and how they connect.</p>
      <main>
        <section aria-labelledby="results-h" class="results-pane">
          <form id="search-form" role="search">
            <label class="sr-only" for="q">Search concepts</label>
            <input id="q" type="search" placeholder="Search concepts…" autocomplete="off" />
            <button type="submit">Search</button>
          </form>
          <h2 id="results-h" class="sr-only">Results</h2>
          <p id="results-count" class="meta" aria-live="polite"></p>
          <ul id="results"></ul>
        </section>
        <article id="node" class="card" aria-live="polite" tabindex="-1">
          <p>Search for a concept, or pick one from the results.</p>
        </article>
      </main>
      <p id="release" class="meta footer" aria-live="polite"></p>
    </div>
    <script type="module" src="explorer.js"></script>
  </body>
</html>
